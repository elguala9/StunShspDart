name: stun_shsp_dart
description: Dart monorepo for STUN and SHSP protocol implementations.
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/stun_shsp

dev_dependencies:
  melos: ^7.4.1

melos:
  repository: https://github.com/your-org/stun_shsp_dart

  scripts:
    test:
      description: Run tests for all packages
      exec: dart test --color
      packageFilters:
        dirExists: test

    test:ipv6:
      description: Run only the IPv6 STUN tests (needs network; IPv6-only cases skip without IPv6)
      exec: dart test --color test/stun_shsp_handler_ipv6_test.dart
      packageFilters:
        scope: stun_shsp

    test:all:
      description: Run the full test suite across every package
      exec: dart test --color
      packageFilters:
        dirExists: test

    analyze:
      description: Analyze all packages
      exec: dart analyze --fatal-infos

    publish:
      description: Publish packages (dry run)
      exec: dart pub publish --dry-run
